name: Weekly official data crawl (무료 공식 지표 자동수집)

# 매주 1회 정부 공식 API(RTMS 실거래·ECOS 기준금리)를 무료로 수집해
# data/seed/auto-official-latest.json 으로 커밋한다. 데이터가 바뀌면
# pages.yml(데이터 경로 트리거)이 자동으로 사이트를 재배포한다.
#
# 비용: 공개 레포의 GitHub Actions는 무료(무제한 분), 정부 API도 무료 → $0.
# LLM 기반 뉴스 크롤링은 유료라 자동화 대상이 아니다(수동/챗 큐레이션 유지).
#
# 사전 준비(1회): 레포 Settings → Secrets and variables → Actions 에 추가
#   - RTMS_KEY : data.go.kr #1613000(아파트 매매 실거래가) 활용신청 후 "Decoding" 인증키
#   - ECOS_KEY : ecos.bok.or.kr 인증키 신청(무료)
# 키가 없으면 이 워크플로는 경고만 남기고 조용히 건너뛴다(실패하지 않음).

on:
  schedule:
    - cron: "0 21 * * 0"   # 매주 일요일 21:00 UTC = 월요일 06:00 KST
  workflow_dispatch:        # 수동 실행(테스트)용

permissions:
  contents: write           # 수집 결과를 main에 커밋

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 키 확인(없으면 건너뜀)
        id: guard
        env:
          RTMS_KEY: ${{ secrets.RTMS_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          LH_KEY: ${{ secrets.LH_KEY }}
          KAPT_KEY: ${{ secrets.KAPT_KEY }}
        run: |
          if [ -z "$RTMS_KEY" ] && [ -z "$ECOS_KEY" ] && [ -z "$LH_KEY" ] && [ -z "$KAPT_KEY" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::RTMS_KEY/ECOS_KEY/LH_KEY/KAPT_KEY 미설정 — 자동수집 건너뜀. 레포 Secrets에 무료 키를 등록하세요."
          fi

      - name: 공식 지표 수집(최근 4개월 시계열)
        if: steps.guard.outputs.skip != '1'
        env:
          RTMS_KEY: ${{ secrets.RTMS_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          set -e
          MONTHS=$(python3 - <<'PY'
          import datetime
          d=datetime.date.today().replace(day=1)
          out=[]
          for _ in range(4):
              out.append(d.strftime("%Y%m"))
              d=(d-datetime.timedelta(days=1)).replace(day=1)
          print(" ".join(out))
          PY
          )
          echo "수집 대상 월: $MONTHS"
          SRC=""
          [ -n "$RTMS_KEY" ] && SRC="$SRC --rtms"
          [ -n "$ECOS_KEY" ] && SRC="$SRC --ecos"
          echo "소스: $SRC"
          if [ -n "$SRC" ]; then
            python3 scripts/apthub_official_apis.py $SRC --months $MONTHS \
              --out data/seed/auto-official-latest.json || \
              echo "::warning::수집 중 일부 오류(네트워크/쿼터) — 가능한 분량만 반영"
          fi

      - name: LH 공공임대단지 수집(수도권 현황·카탈로그)
        if: success() && steps.guard.outputs.skip != '1'
        env:
          LH_KEY: ${{ secrets.LH_KEY }}
        run: |
          if [ -n "$LH_KEY" ]; then
            python3 scripts/apthub_official_apis.py --lh \
              --out data/seed/auto-lh-lease.json \
              --complex-out data/complex/auto-lh.json || \
              echo "::warning::LH 수집 오류 — 스키마/쿼터 확인(로그의 '첫 레코드 키' 참고)"
          else
            echo "LH_KEY 미설정 — LH 임대단지 수집 건너뜀"
          fi

      - name: K-apt 아파트 재고 수집(공공임대 비율 분모)
        if: success() && steps.guard.outputs.skip != '1'
        env:
          KAPT_KEY: ${{ secrets.KAPT_KEY }}
          KAPT_STD_UDDI: ${{ secrets.KAPT_STD_UDDI }}
        run: |
          if [ -n "$KAPT_KEY" ] && [ -n "$KAPT_STD_UDDI" ]; then
            # 벌크 표준데이터(#15096285) 경로 — uddi 있을 때
            python3 scripts/apthub_official_apis.py --kapt \
              --out data/seed/auto-kapt-stock.json || \
              echo "::warning::K-apt 벌크 수집 오류 — uddi/쿼터 확인(로그 참고)"
          elif [ -n "$KAPT_KEY" ]; then
            # 목록+기본정보 API(#15057332+#15058453) 경로 — uddi 불필요(단지당 1콜)
            python3 scripts/apthub_official_apis.py --kapt-api \
              --out data/seed/auto-kapt-stock.json || \
              echo "::warning::K-apt API 수집 오류 — 목록(#15057332) 활용신청·쿼터 확인(로그 참고)"
          else
            echo "KAPT_KEY 미설정 — 아파트 재고(분모) 수집 건너뜀"
          fi

      - name: 빌드 검증(공개판)
        if: success() && steps.guard.outputs.skip != '1'
        env:
          APTHUB_PUBLIC: "1"
        run: python3 scripts/build_site.py

      - name: 변경분 커밋(있을 때만)
        if: success() && steps.guard.outputs.skip != '1'
        run: |
          git config user.name  "apthub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 파일별로 add — 일부 소스만 켜져(예: LH_KEY만) 미생성 파일이 있어도
          # 하나의 pathspec 불일치로 git add 전체가 중단되지 않도록 개별 처리.
          for f in data/seed/auto-official-latest.json data/seed/auto-lh-lease.json data/complex/auto-lh.json data/seed/auto-kapt-stock.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 주간 공식 지표 자동 수집(RTMS·ECOS·LH 공공임대)"
            git push
          fi
